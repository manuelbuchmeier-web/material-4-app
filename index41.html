<script>

/*
================================================
SUPABASE
================================================
*/

const SUPABASE_URL =
"https://ihgyfihlzbsdnbusynrz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tWAzMhdZcU4v2Ki9diNT1A_ku6-J467";

const FUNCTION_URL =
SUPABASE_URL +
"/functions/v1/smooth-service";


/*
================================================
DATEN
================================================
*/

let materials = [];

let history = [];

let scanner = null;

let busy = false;


/*
================================================
SUPABASE DATEN LADEN
================================================
*/

async function loadMaterials(){

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/materials?select=*&order=id",
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );


    if(!response.ok){

      throw new Error(
        "Materialdaten konnten nicht geladen werden."
      );

    }


    materials = await response.json();


    if(!Array.isArray(materials)){

      throw new Error(
        "Ungültige Materialdaten."
      );

    }


    document.getElementById("msg")
      .textContent =
      "Bereit – QR-Code vor die Kamera halten.";


    renderStock();


  }catch(error){

    console.error(error);

    document.getElementById("msg")
      .textContent =
      "Fehler beim Laden des Materialbestands.";

  }

}


/*
================================================
HISTORIE LADEN
================================================
*/

async function loadHistory(){

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/material_history?select=*&order=created_at.desc",
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );


    if(!response.ok){

      throw new Error(
        "Verlauf konnte nicht geladen werden."
      );

    }


    history = await response.json();


    renderHistory();


  }catch(error){

    console.error(error);

    document.getElementById("hist")
      .innerHTML =
      "<p class='muted'>Verlauf konnte nicht geladen werden.</p>";

  }

}


/*
================================================
ANSICHT
================================================
*/

function show(id){

  ["scan","stock","history"].forEach(
    x => {

      document
        .getElementById(x)
        .classList
        .toggle("hidden",x!==id);

    }
  );


  if(id==="stock"){

    loadMaterials();

  }


  if(id==="history"){

    loadHistory();

  }

}


/*
================================================
NORMALISIEREN
================================================
*/

function norm(x){

  return String(x ?? "")
    .trim()
    .replace(/[\u200B-\u200D\uFEFF]/g,"")
    .replace(/\s+/g,"");

}


/*
================================================
KAMERA
================================================
*/

async function startScanner(){

  if(scanner || busy)
    return;


  busy=true;


  document.getElementById("msg")
    .textContent =
    "Kamera wird gestartet …";


  document.getElementById("start")
    .classList
    .add("hidden");


  document.getElementById("stop")
    .classList
    .remove("hidden");


  try{


    if(
      !window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Kamera API nicht verfügbar"
      );

    }


    if(scanner){

      try{
        await scanner.stop();
      }catch(e){}

      try{
        await scanner.clear();
      }catch(e){}

      scanner=null;

    }


    scanner =
      new Html5Qrcode("reader");


    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        aspectRatio:1.0
      },

      onScan,

      () => {}

    );


    document.getElementById("msg")
      .textContent =
      "Bereit – QR-Code vor die Kamera halten.";


  }catch(e){

    console.error(e);


    document.getElementById("msg")
      .textContent =
      "Kamera konnte nicht gestartet werden. Bitte Safari den Kamerazugriff erlauben.";


    try{

      if(scanner)
        await scanner.clear();

    }catch(_){}


    scanner=null;


    document.getElementById("start")
      .classList
      .remove("hidden");


    document.getElementById("stop")
      .classList
      .add("hidden");

  }


  busy=false;

}


/*
================================================
KAMERA STOPPEN
================================================
*/

async function stopScanner(){

  if(!scanner)
    return;


  const current=scanner;

  scanner=null;


  try{

    const state =
      current.getState
      ?
      current.getState()
      :
      null;


    if(state===2){

      await current.stop();

    }

  }catch(e){}


  try{

    await current.clear();

  }catch(e){}


  document.getElementById("reader")
    .innerHTML="";


  document.getElementById("start")
    .classList
    .remove("hidden");


  document.getElementById("stop")
    .classList
    .add("hidden");

}


/*
================================================
QR CODE ERKANNT
================================================
*/

async function onScan(text){

  if(busy)
    return;


  busy=true;


  await stopScanner();


  select(text);


  busy=false;

}


/*
================================================
MATERIAL AUSWÄHLEN
================================================
*/

function select(code){

  const raw =
    String(code ?? "");


  const n =
    norm(raw);


  const m =
    materials.find(
      x =>
        norm(x.qr)===n ||
        norm(x.id)===n
    );


  document.getElementById("msg")
    .textContent =
    "QR gelesen: " + raw;


  if(!m){

    document.getElementById("msg")
      .textContent =
      "QR-Code nicht bekannt: " + raw;

    return;

  }


  const c =
    document.getElementById("material");


  c.classList.remove("hidden");


  c.innerHTML = `

    <h2>${m.artikel}</h2>

    <div class="info">

      <div class="kv">

        <small>Material-ID</small>

        <b>${m.id}</b>

      </div>


      <div class="kv">

        <small>Bestand</small>

        <b class="stock">

          ${m.bestand}
          ${m.einheit}

        </b>

      </div>


      <div class="kv">

        <small>Kategorie</small>

        <b>${m.kategorie}</b>

      </div>


      <div class="kv">

        <small>Lagerort</small>

        <b>${m.lagerort}</b>

      </div>

    </div>


    ${
      m.bestand < m.mindestbestand

      ?

      `
      <p class="warning">

        ⚠️ Bestand unter Mindestbestand

      </p>
      `

      :

      ""
    }


    <h3>Menge</h3>


    <input
      id="qty"
      type="number"
      min="1"
      value="1"
    >


    <div
      class="row"
      style="margin-top:12px"
    >

      <button
        class="danger"
        onclick="book('${m.id}','Entnahme')"
      >

        − Entnahme

      </button>


      <button
        class="primary"
        onclick="book('${m.id}','Rückgabe')"
      >

        ＋ Rückgabe

      </button>

    </div>


    <button
      class="secondary"
      style="width:100%;margin-top:10px"
      onclick="again()"
    >

      📷 Nächsten QR-Code scannen

    </button>

  `;

}


/*
================================================
NÄCHSTER SCAN
================================================
*/

async function again(){

  document
    .getElementById("material")
    .classList
    .add("hidden");


  show("scan");


  await startScanner();

}


/*
================================================
BUCHUNG ÜBER EDGE FUNCTION
================================================
*/

async function book(id,a){

  const qtyInput =
    document.getElementById("qty");


  const q =
    Math.floor(
      Number(qtyInput.value)
    );


  if(!q || q<1){

    alert(
      "Bitte eine gültige Menge eingeben."
    );

    return;

  }


  const action =
    a==="Entnahme"
    ?
    "book"
    :
    "return";


  try{

    document.getElementById("msg")
      .textContent =
      "Buchung wird gespeichert …";


    /*
    Edge Function aufrufen
    */

    const response =
      await fetch(
        FUNCTION_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({

            id:id,

            action:action,

            qty:q

          })

        }
      );


    const result =
      await response.json();


    if(!response.ok || !result.success){

      throw new Error(
        result.error ||
        "Buchung fehlgeschlagen."
      );

    }


    /*
    Zentrale Daten neu laden
    */

    await loadMaterials();


    /*
    Material mit aktuellem Bestand anzeigen
    */

    const updated =
      materials.find(
        x=>x.id===id
      );


    if(updated){

      select(updated.id);

    }


    document.getElementById("msg")
      .textContent =
      "Buchung erfolgreich gespeichert.";


    alert(

      a +
      " gebucht.\n\nNeuer Bestand: " +
      result.newStock +
      " " +
      (updated?.einheit || "")

    );


  }catch(error){

    console.error(error);


    document.getElementById("msg")
      .textContent =
      "Buchung konnte nicht gespeichert werden.";


    alert(
      "Fehler bei der Buchung:\n\n" +
      error.message
    );

  }

}


/*
================================================
BESTAND
================================================
*/

function renderStock(){

  document.getElementById("stocks")
    .innerHTML =

    materials.map(m=>`

      <div class="log">

        <b>${m.artikel}</b>

        <br>

        ${m.id}

        ·

        ${m.bestand}
        ${m.einheit}

        ·

        Mindestbestand
        ${m.mindestbestand}

        ${
          m.bestand < m.mindestbestand

          ?

          `
          <br>
          <span class="warning">
            ⚠️ Unter Mindestbestand
          </span>
          `

          :

          ""
        }

      </div>

    `).join("");

}


/*
================================================
VERLAUF
================================================
*/

function renderHistory(){

  document.getElementById("hist")
    .innerHTML =

    history.length

    ?

    history.map(x=>`

      <div class="log">

        <b>
          ${
            x.action==="book"
            ?
            "Entnahme"
            :
            "Rückgabe"
          }
        </b>

        ·

        ${x.qty}

        <br>

        ${x.artikel}

        (${x.material_id})

        <br>

        ${
          new Date(x.created_at)
          .toLocaleString("de-DE")
        }

        · neuer Bestand

        ${x.new_stock}

      </div>

    `).join("")

    :

    "<p class='muted'>Noch keine Buchungen.</p>";

}


/*
================================================
START
================================================
*/

async function init(){

  document.getElementById("msg")
    .textContent =
    "Materialbestand wird geladen …";


  await loadMaterials();


  await loadHistory();

}


/*
================================================
KAMERA BEIM VERLASSEN STOPPEN
================================================
*/

window.addEventListener(
  "pagehide",
  () => {
    stopScanner();
  }
);


document.addEventListener(
  "visibilitychange",
  () => {

    if(document.hidden)
      stopScanner();

  }
);


/*
APP STARTEN
*/

init();

</script>

</body>
</html>
